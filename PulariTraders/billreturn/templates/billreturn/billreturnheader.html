<table class="boxShape entryForm" id="accountTable">
    <!-- HEADER -->
    <tr class="formHeaderReturnEntry">
        <td></td>
        <td colspan="4" style="text-align: left;">
            Bill Return
        </td>
        <td style="text-align: right;">
            <!-- <a href="" class="searchLink">Search..</a> -->
        </td>
        <td></td>
    </tr>

    <tr class="rowSpacing"><td></td></tr>

    <!-- TYPE + BILL NO -->
    <tr>
        <td style="width: 1%;"></td>

        <td style="width: 9%;">Type</td>
        <td style="width: 50%;">
            <div style="display:flex; gap:15px; align-items:center;">
                
                <label>
                    <input type="radio" id="br_customer_sle" name="br_counter_sale" value="0"
                        {% if not bill_return_header or bill_return_header.br_counter_sale == 0 %}checked{% endif %}
                        onclick="setBillType(this.value)"
                        {% if bill_return_header and bill_return_header.br_rid %}
                            disabled
                        {% endif %}>
                    Account Bill
                </label>

                <label>
                    <input type="radio" id="br_counter_sle" name="br_counter_sale" value="1"
                        {% if bill_return_header and bill_return_header.br_counter_sale == 1 %}checked{% endif %}
                        onclick="setBillType(this.value)"
                        {% if bill_return_header and bill_return_header.br_rid %}
                            disabled
                        {% endif %}>
                    Cash Party
                </label>

            </div>
        </td>

        <td></td>

        <td style="width: 8%;">Bill No</td>
        <td style="width: 30%;">
            <input type="text"
                   name="br_bill_return_no"
                   value="{{ bill_return_header.br_bill_return_no|default:'' }}"
                   class="form-control form-control-sm"
                   readonly tabindex="-1">
        </td>

        <td></td>
    </tr>

    <!-- ACCOUNT + DATE -->
    <tr>
        <td></td>

        <td>Account</td>
        <td>
            <table>
                <tr>
                    <td style="width: 85%;">
                        <!-- hidden RID -->
                        <input type="hidden"
                            id="br_acc_rid"
                            name="br_acc_rid"
                            value="{{ bill_return_header.br_acc_rid|default:'' }}">

                        <!-- visible name -->
                        <input type="text"
                            id="br_acc_name"
                            name="br_acc_name"
                            class="form-control form-control-sm"
                            value="{{ account.acc_disp_name|default:'' }}"
                            autocomplete="off"
                            {% if bill_return_header and bill_return_header.br_rid %}
                                readonly
                            {% endif %}>
                        <div id="suggestionBox" class="suggestion-box"></div>
                    </td>
                    <td style="width: 15%;">
                        <input type="text"
                            id="br_acc_code" name="br_acc_code"
                            value="{{ account.acc|default:'' }}"
                            class="form-control form-control-sm"
                            readonly tabindex="-1">
                    </td>
                </tr>
            </table>
            
        </td>

        <td></td>

        <td>Date</td>
        <td>
            <input type="date"
                   name="br_bill_return_date"
                   id="br_bill_return_date"
                   value="{% if bill_return_header %}{{ bill_return_header.br_bill_return_date|date:'Y-m-d' }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}"
                   class="form-control form-control-sm"
                   {% if bill_return_header and bill_return_header.br_rid %}
                                readonly
                            {% endif %}
                    tabindex="-1">
        </td>

        <td></td>
    </tr>

    <!-- ADDRESS -->
    <tr id="accountDetailsRow">
        <td></td>

        <td>Address</td>
        <td>
            <input type="text"
                   id="accountAddress"
                   name="address"
                   class="form-control form-control-sm"
                   value="{{ account.acc_address|default:'' }}"
                   tabindex="-1" readonly>
        </td>

        <td></td>

        <td>Phone</td>
        <td>
            <input type="text"
                   id="accountPhone"
                   name="phone"
                   class="form-control form-control-sm"
                   value="{{ account.acc_phone|default:'' }}"
                   tabindex="-1" readonly>
        </td>
    </tr>
    <!-- NOTES -->
    <tr>
        <td></td>

        <td>Notes</td>
        <td>
            <input type="text"
                id="br_notes" name="br_notes"
                class="form-control form-control-sm"
                value="{{ bill_return_header.br_notes|default:'' }}"
                {% if bill_return_header and bill_return_header.br_rid %}
                readonly
                {% endif %}>
        </td>

        <td></td>
        <td colspan="2">
            {% if bill_return_header.br_rid and bill_return_header.br_status == 'Cancelled' %}
                <div class="cancelledTransaction">The Bill Return is cancelled.</div>
            {% endif %}
        </td>
    </tr>

</table>
