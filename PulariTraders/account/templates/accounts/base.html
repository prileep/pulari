<!DOCTYPE html>
<html lang="en">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <title>PULARI | Feed Inventory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">
    <link rel="stylesheet" href="{% static 'css/autocomplete.css' %}">
    <link rel="stylesheet" href="{% static 'css/loadingbar.css' %}">
   
    <!-- <script src="{% static 'bill/js/autocomplete.js' %}"></script> -->
    <script src="{% static 'js/autocomplete.js' %}"></script>
    <script src="{% static 'js/tablehandler.js' %}"></script>
    <script src="{% static 'js/util.js' %}"></script>

    <style></style>
</head>
<body style="background-color: #eef4ff;">
    
<table>
    <tr>
        <td style="width: 5%;"></td>
        <td style="width: 93%;">
            <div class="brand-title highlight-title" style="color: #1e40af; text-align: center;">PULARI TRADERS&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</div>
        </td>
        <td style="width: 2%;"></td>
    </tr>
    <tr>
        <td></td>
        <td>
            {% include 'accounts/menubar.html' %}
        </td>
        <td></td>
    </tr>
    <tr>
        <td></td>
        <td>
            <!-- MAIN CONTENT (CLEAN) -->
            <div>
                {% block content %}
                {% endblock %}
            </div>
        </td>
        <td></td>
    </tr>
</table>

<!-- this is required for the autocomplete work all over the screen -->
<table>
    <tbody id="container"></tbody>
</table>
<div id="loadingContainer">
    <div class="progress" id="loadingBar">
        <div class="progress-bar progress-bar-striped progress-bar-animated"
             role="progressbar"
             style="width:100%">
            Loading...
        </div>
    </div>

    <div class="loadingText">
        Please wait while loading data
    </div>
</div>



<!-- FOOTER -->
<!-- <footer class="bg-white text-center text-muted py-3 shadow-sm" style="position: fixed;bottom: 0;width: 100%;">
    © 2026 <strong>Pulari Traders</strong> 
</footer> -->


<script>
    // GLOBAL FIX: Prevents accidental form submission when users press the Enter key inside form inputs
    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            const element = event.target;
            
            // Block Enter for inputs/selects, but allow it for textareas (new lines)
            if (element.tagName === "INPUT" || element.tagName === "SELECT") {
                event.preventDefault();
                return false;
            }
        }
    });
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    hideLoadingBar();

    document.querySelectorAll("form").forEach(form => {
        form.setAttribute("autocomplete", "off");
    });

    document.querySelectorAll("input, textarea, select").forEach(el => {
        el.setAttribute("autocomplete", "off");
    });

});
</script>
{% block scripts %}
{% endblock %}

</body>
</html>
