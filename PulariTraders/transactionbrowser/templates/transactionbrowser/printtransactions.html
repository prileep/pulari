<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transaction Report</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #222;
            background: #fff;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        h2 {
            margin: 0;
            font-size: 22px;
        }

        .muted {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        /* Wrapper container to line up summary elements horizontally on the right side */
        .top-right-displays {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: flex-end;
            width: 65%; /* Allocated flexible spacing room across the header banner */
        }

        /* Top Right Pivot Summary Table Styles */
        .top-summary-pivot {
            width: 320px;
            font-size: 12px;
            margin-bottom: 0;
        }
        
        .top-summary-pivot th, 
        .top-summary-pivot td {
            padding: 5px 8px;
            border: 1px solid #cfcfcf;
        }
        
        .top-summary-pivot tbody th {
            background: #f8f9fa;
            font-weight: normal;
            color: #444;
            text-align: left;
            width: 40%;
        }

        .top-summary-pivot td {
            text-align: right;
            width: 30%;
        }

        .top-summary-pivot .pivot-total-row th,
        .top-summary-pivot .pivot-total-row td {
            font-weight: bold;
            background: #fafafa;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* Compact secondary items summary tracking grid */
        .compact-summary-table {
            width: 250px; /* Constrained baseline width layout footprint to look cleaner next to balance card */
            font-size: 12px;
            margin-bottom: 0;
        }

        th, td {
            border: 1px solid #cfcfcf;
            padding: 8px 10px;
            vertical-align: top;
        }

        .fit-content {
            white-space: nowrap;
        }

        th {
            background: #f3f3f3;
            text-align: left;
        }

        td.num,
        th.num {
            text-align: right;
            white-space: nowrap;
        }

        td.center,
        th.center {
            text-align: center;
        }

        .nowrap {
            white-space: nowrap;
        }

        .summary-row td {
            font-weight: bold;
            background: #fafafa;
        }

        @media print {

            body {
                margin: 0;
            }

            .page {
                max-width: none;
                margin: 0;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="header">

        <div>
            <h2>TRANSACTION REPORT</h2>
            <div id="filtersTextDisplay" style="font-size: 13px; line-height: 1.5; margin-top: 4px;"></div>

            <div class="muted" style="margin-top: 6px;">
                Printed on:
                <span id="generatedOn"></span>
            </div>
        </div>

        <div class="top-right-displays">
            
            <!-- Updated: Completely dropped the explicit <thead> markup block segment from the pivot frame wrapper -->
            <table class="top-summary-pivot" id="pivotSummaryTable">
                <tbody id="pivotSummaryBody">
                    <tr>
                        <td colspan="3" class="center">Loading...</td>
                    </tr>
                </tbody>
            </table>

            <table class="compact-summary-table" id="itemSummarySection">
                <thead>
                    <tr>
                        <th class="fit-content">Item Code</th>
                        <th class="num fit-content">StockIn</th>
                        <th class="num fit-content">StockOut</th>
                    </tr>
                </thead>
                <tbody id="itemSummaryBody">
                    <tr>
                        <td colspan="3" class="center">
                            Loading...
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

    </div>

    <table id="mainReportTable">
        <thead>
            <tr>
                <th class="center">#</th>
                <th id="dateHeader">Date</th>
                <th>Account</th>
                <th>Notes</th>
                <th class="num">Cash In</th>
                <th class="num">Cash Out</th>
            </tr>
        </thead>
        <tbody id="reportBody">
            <tr>
                <td colspan="6" class="center" id="initialLoadingCell">
                    Loading...
                </td>
            </tr>
        </tbody>
    </table>

</div>

<script>

function formatIndianCurrency(value) {
    if (value === 0 || !value) return "-";
    return new Intl.NumberFormat(
        "en-IN",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }
    ).format(Number(value));

}

function formatToIndianDate(dateStr) {
    if (!dateStr) return "-";
    const parts = dateStr.split("-");
    if (parts.length === 3 && parts[0].length === 4) {
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    return dateStr;
}

function formatGeneratedTimestamp() {
    const now = new Date();
    
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();
    
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    
    hours = hours % 12;
    hours = hours ? hours : 12;
    const strHours = String(hours).padStart(2, '0');
    
    return `${day}-${month}-${year} ${strHours}:${minutes} ${ampm}`;
}

function getParams() {

    return new URLSearchParams(window.location.search);

}

function buildFiltersText(params) {
    const parts = [];
    const map = [
        ["acctran_ref_type", "Type"],
        ["status", "Status"],
        ["from_date", "From"],
        ["to_date", "To"],
        ["account_rid", "Account"],
        ["refno", "Ref No"],
        ["notes", "Notes"],
        ["amount_from", "Amount From"],
        ["amount_to", "Amount To"],
    ];

    map.forEach(([key, label]) => {
        let val = params.get(key);
        if (val) {
            if (key === "from_date" || key === "to_date") {
                val = formatToIndianDate(val);
            }
            parts.push(`<strong>${label}:</strong> ${val}`);
        }
    });

    return parts.length ? parts.join(" | ") : "All records";
}

async function loadReport() {

    const params = getParams();
    
    const fromDate = params.get("from_date");
    const toDate = params.get("to_date");
    const isSameDayRange = (fromDate && toDate && fromDate === toDate);
    
    let tableTotalColumns = 6;
    if (isSameDayRange) {
        tableTotalColumns = 5;
        const dateHeader = document.getElementById("dateHeader");
        if (dateHeader) dateHeader.remove();
    }

    document.getElementById("filtersTextDisplay").innerHTML = buildFiltersText(params);
    document.getElementById("generatedOn").innerHTML = formatGeneratedTimestamp();

    const body = document.getElementById("reportBody");
    const itemBody = document.getElementById("itemSummaryBody");
    const pivotBody = document.getElementById("pivotSummaryBody");

    body.innerHTML = `
        <tr>
            <td colspan="${tableTotalColumns}" class="center">
                Loading...
            </td>
        </tr>
    `;
    
    itemBody.innerHTML = `
        <tr>
            <td colspan="3" class="center">
                Loading...
            </td>
        </tr>
    `;

    try {

        const res = await fetch(
            `/transactionbrowser/transaction-search/?${params.toString()}`
        );

        if (!res.ok) {

            throw new Error(`HTTP ${res.status}`);

        }

        const data = await res.json();

        if (!data.transactions || data.transactions.length === 0) {

            body.innerHTML = `
                <tr>
                    <td colspan="${tableTotalColumns}" class="center">
                        No matching records found!
                    </td>
                </tr>
            `;
            
            pivotBody.innerHTML = `
                <tr>
                    <td colspan="3" class="center">- No Data -</td>
                </tr>
            `;

        } else {
            
            data.transactions.sort((a, b) => {
                const parseToCompareDate = (dStr) => {
                    if (!dStr) return "";
                    const p = dStr.split("-");
                    return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : dStr;
                };

                const dateA = parseToCompareDate(a.acctran_date);
                const dateB = parseToCompareDate(b.acctran_date);

                if (dateA !== dateB) {
                    return dateA.localeCompare(dateB);
                }

                const nameA = (a.acc_name || "").toUpperCase().trim();
                const nameB = (b.acc_name || "").toUpperCase().trim();

                if (nameA.includes("CASH") && !nameB.includes("CASH")) return -1;
                if (nameB.includes("CASH") && !nameA.includes("CASH")) return 1;

                return nameA.localeCompare(nameB);
            });

            const rows = [];
            let i = 0;
            let totCashIn = 0;
            let totCashOut = 0;

            const pivotMap = {};

            data.transactions.forEach((item) => {
                const cashInAmt = Number(item.cr_amt || 0);
                const cashOutAmt = Number(item.dr_amt || 0);
                
                totCashIn += cashInAmt;
                totCashOut += cashOutAmt;

                const rawRefType = item.acctran_ref_type || item.tran_type || "Other";
                const refType = rawRefType.trim();

                if (!pivotMap[refType]) {
                    pivotMap[refType] = { cashIn: 0, cashOut: 0 };
                }
                pivotMap[refType].cashIn += cashInAmt;
                pivotMap[refType].cashOut += cashOutAmt;

                const notes =
                    (item.acc_notes || "")
                    .replaceAll(" • ", " • <wbr> ");

                const dateCellHtml = isSameDayRange ? "" : `
                    <td class="nowrap">
                        ${formatToIndianDate(item.acctran_date)}
                    </td>
                `;

                rows.push(`
                    <tr>
                        <td class="center">
                            ${++i}
                        </td>
                        ${dateCellHtml}
                        <td>
                            ${item.acc_name || ""}
                        </td>
                        <td>
                            ${notes}
                        </td>
                        <td class="num">
                            ${cashInAmt === 0 ? "-" : formatIndianCurrency(cashInAmt)}
                        </td>
                        <td class="num">
                            ${cashOutAmt === 0 ? "-" : formatIndianCurrency(cashOutAmt)}
                        </td>
                    </tr>
                `);

            });

            const summaryColspan = isSameDayRange ? 3 : 4;

            rows.push(`
                <tr class="summary-row">
                    <td colspan="${summaryColspan}" class="num">Total</td>
                    <td class="num">
                        ${formatIndianCurrency(totCashIn)}
                    </td>
                    <td class="num">
                        ${formatIndianCurrency(totCashOut)}
                    </td>
                </tr>
            `);

            body.innerHTML = rows.join("");

            const pivotRows = [];
            const sortedRefTypes = Object.keys(pivotMap).sort();
            
            sortedRefTypes.forEach(type => {
                pivotRows.push(`
                    <tr>
                        <th>${type}</th>
                        <td>${formatIndianCurrency(pivotMap[type].cashIn)}</td>
                        <td>${formatIndianCurrency(pivotMap[type].cashOut)}</td>
                    </tr>
                `);
            });

            pivotRows.push(`
                <tr class="pivot-total-row">
                    <th>Total</th>
                    <td>${formatIndianCurrency(totCashIn)}</td>
                    <td>${formatIndianCurrency(totCashOut)}</td>
                </tr>
            `);
            
            pivotBody.innerHTML = pivotRows.join("");
        }

        if (!data.itemsummary || data.itemsummary.length === 0) {
            itemBody.innerHTML = `
                <tr>
                    <td colspan="3" class="center">
                        No records.
                    </td>
                </tr>
            `;
        } else {
            const itemRows = [];

            data.itemsummary.forEach(summaryItem => {
                const codeStr = summaryItem.item_code || "-";

                itemRows.push(`
                    <tr>
                        <td class="fit-content">${codeStr}</td>
                        <td class="num fit-content">${summaryItem.StockIn == 0 ? "-" : formatIndianCurrency(summaryItem.StockIn)}</td>
                        <td class="num fit-content">${summaryItem.StockOut == 0 ? "-" : formatIndianCurrency(summaryItem.StockOut)}</td>
                    </tr>
                `);
            });

            itemBody.innerHTML = itemRows.join("");
        }

        setTimeout(() => {
            window.print();
        }, 300);

    }
    catch (err) {

        console.error(err);

        body.innerHTML = `
            <tr>
                <td colspan="${tableTotalColumns}" class="center">
                    Error loading report
                </td>
            </tr>
        `;
        
        itemBody.innerHTML = `
            <tr>
                <td colspan="3" class="center">
                    Error.
                </td>
            </tr>
        `;

        pivotBody.innerHTML = `
            <tr>
                <td colspan="3" class="center">Error</td>
            </tr>
        `;
    }
}

window.addEventListener("load", loadReport);

</script>

</body>
</html>
