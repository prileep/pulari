<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Balance Sheet</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #222;
            background: #fff;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        h2 {
            margin: 0;
            font-size: 22px;
        }

        .muted {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #cfcfcf;
            padding: 8px 10px;
            vertical-align: top;
        }

        th {
            background: #f3f3f3;
            text-align: left;
        }

        td.num,
        th.num {
            text-align: right;
            white-space: nowrap;
        }

        td.center,
        th.center {
            text-align: center;
        }

        .nowrap {
            white-space: nowrap;
        }

        .summary-row td {
            font-weight: bold;
            background: #fafafa;
        }

        .summary-label-row td {
            font-style: italic;
            color: grey;
            background: #fff;
            font-weight: normal;
        }

        @media print {

            body {
                margin: 0;
            }

            .page {
                max-width: none;
                margin: 0;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="header">

        <div>
            <h2 id="reportTitle">Balance Sheet</h2>

            <div class="muted">
                Generated on:
                <span id="generatedOn"></span>
            </div>
        </div>

    </div>

    <table>

        <thead>

            <tr>
                <th class="center">#</th>
                <th>Date</th>
                <th>Notes</th>
                <th class="num">Cash In</th>
                <th class="num">Cash Out</th>
                <th class="num">Balance</th>
            </tr>

        </thead>

        <tbody id="reportBody">

            <tr>
                <td colspan="6" class="center">
                    Loading...
                </td>
            </tr>

        </tbody>

    </table>

</div>

<script>

function formatIndianCurrency(value) {

    return new Intl.NumberFormat(
        "en-IN",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }
    ).format(Number(value || 0));

}

function getParams() {

    return new URLSearchParams(window.location.search);

}

async function loadReport() {

    const params = getParams();

    const account = params.get("account") || "All Accounts";
    const fromDate = params.get("from_date") || "";
    const toDate = params.get("to_date") || "";

    let title = account;

    if (fromDate || toDate) {

        title += ` (${fromDate} to ${toDate})`;

    }

    document.getElementById("reportTitle").innerHTML = title;

    document.getElementById("generatedOn").innerHTML =
        new Date().toLocaleString();

    const body = document.getElementById("reportBody");

    body.innerHTML = `
        <tr>
            <td colspan="6" class="center">
                Loading...
            </td>
        </tr>
    `;

    try {

        const res = await fetch(
            `/transactionbrowser/transaction-search/?${params.toString()}`
        );

        if (!res.ok) {

            throw new Error(`HTTP ${res.status}`);

        }

        const data = await res.json();

        if (!data.transactions || data.transactions.length === 0) {

            body.innerHTML = `
                <tr>
                    <td colspan="6" class="center">
                        No matching records found!
                    </td>
                </tr>
            `;

            return;
        }

        const rows = [];

        let i = 0;
        let totCashIn = 0;
        let totCashOut = 0;
        let lastItem = null;

        data.transactions.forEach(item => {

            lastItem = item;

            totCashIn += Number(item.cr_amt || 0);
            totCashOut += Number(item.dr_amt || 0);

            const notes =
                (item.acc_notes || "")
                .replaceAll(" • ", " • <wbr> ");

            rows.push(`

                <tr>

                    <td class="center">
                        ${++i}
                    </td>

                    <td class="nowrap">
                        ${item.acctran_date || ""}
                    </td>

                    <td>
                        ${notes}
                    </td>

                    <td class="num">
                        ${
                            item.cr_amt == 0
                            ? "-"
                            : formatIndianCurrency(item.cr_amt)
                        }
                    </td>

                    <td class="num">
                        ${
                            item.dr_amt == 0
                            ? "-"
                            : formatIndianCurrency(item.dr_amt)
                        }
                    </td>

                    <td class="num">
                        ${formatIndianCurrency(item.balance)}
                    </td>

                </tr>

            `);

        });

        rows.push(`

            <tr class="summary-row">

                <td colspan="2"></td>

                <td class="num">
                    ${formatIndianCurrency(lastItem.open_balance)}
                </td>

                <td class="num">
                    (-)${formatIndianCurrency(totCashIn)}
                </td>

                <td class="num">
                    ${formatIndianCurrency(totCashOut)}
                </td>

                <td class="num">
                    ${formatIndianCurrency(lastItem.balance)}
                </td>

            </tr>

        `);

        rows.push(`

            <tr class="summary-label-row">

                <td colspan="2"></td>

                <td class="num">
                    (Opening)
                </td>

                <td class="num">
                    (Cash In)
                </td>

                <td class="num">
                    (Cash Out)
                </td>

                <td class="num">
                    (Closing)
                </td>

            </tr>

        `);

        body.innerHTML = rows.join("");

    }
    catch (err) {

        console.error(err);

        body.innerHTML = `
            <tr>
                <td colspan="6" class="center">
                    Error loading report
                </td>
            </tr>
        `;
    }
}

window.addEventListener("load", loadReport);

</script>

</body>
</html>
