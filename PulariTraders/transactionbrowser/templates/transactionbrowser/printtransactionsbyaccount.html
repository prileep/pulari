<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Balance Sheet</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #222;
            background: #fff;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        h2 {
            margin: 0;
            font-size: 22px;
        }

        .muted {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        /* Top Right Vertical Summary Card Styles */
        .top-summary-table {
            width: 240px;
            font-size: 12px;
        }
        
        .top-summary-table th, 
        .top-summary-table td {
            padding: 4px 10px;
            border: 1px solid #e0e0e0;
        }
        
        .top-summary-table th {
            background: #f8f9fa;
            font-weight: normal;
            color: #555;
            text-align: left;
            width: 50%;
        }

        .top-summary-table td {
            text-align: right;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #cfcfcf;
            padding: 8px 10px;
            vertical-align: top;
        }

        th {
            background: #f3f3f3;
            text-align: left;
        }

        td.num,
        th.num {
            text-align: right;
            white-space: nowrap;
        }

        td.center,
        th.center {
            text-align: center;
        }

        .nowrap {
            white-space: nowrap;
        }

        .summary-row td {
            font-weight: bold;
            background: #fafafa;
        }

        @media print {

            body {
                margin: 0;
            }

            .page {
                max-width: none;
                margin: 0;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="header">

        <div>
            <!-- Hardcoded text element adjusted to uppercase requested string -->
            <h2>BALANCE SHEET</h2>
            <div id="accountNameDisplay" style="font-size: 15px; font-weight: bold; margin-top: 4px;"></div>
            
            <!-- Date Range Display Container Element -->
            <div id="dateRangeDisplay" class="muted" style="font-weight: bold; margin-bottom: 2px;"></div>

            <div class="muted">
                Generated on:
                <span id="generatedOn"></span>
            </div>
        </div>

        <!-- Top Right Row-Based Summary Table -->
        <div>
            <table class="top-summary-table">
                <tbody>
                    <tr>
                        <th>Opening Balance</th>
                        <td id="topOpening">-</td>
                    </tr>
                    <tr>
                        <th>Cash In</th>
                        <td id="topCashIn">-</td>
                    </tr>
                    <tr>
                        <th>Cash Out</th>
                        <td id="topClosingOut">-</td>
                    </tr>
                    <tr style="background: #fafafa;">
                        <th>Closing Balance</th>
                        <td id="topClosing">-</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <table>

        <thead>

            <tr>
                <th class="center">#</th>
                <th>Date</th>
                <th>Notes</th>
                <th class="num">Cash In</th>
                <th class="num">Cash Out</th>
                <th class="num">Balance</th>
            </tr>

        </thead>

        <tbody id="reportBody">

            <tr>
                <td colspan="6" class="center">
                    Loading...
                </td>
            </tr>

        </tbody>

    </table>

</div>

<script>

function formatIndianCurrency(value) {

    return new Intl.NumberFormat(
        "en-IN",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }
    ).format(Number(value || 0));

}

// Helper Function to cleanly switch YYYY-MM-DD into DD-MM-YYYY
function formatToIndianDate(dateStr) {
    if (!dateStr) return "-";
    const parts = dateStr.split("-");
    if (parts.length === 3 && parts[0].length === 4) {
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    return dateStr;
}

function getParams() {

    return new URLSearchParams(window.location.search);

}

async function loadReport() {

    const params = getParams();

    const account = params.get("account") || "All Accounts";
    const fromDate = params.get("from_date") || "";
    const toDate = params.get("to_date") || "";

    // Placed Account identifier string into its own descriptive element layer underneath main title
    document.getElementById("accountNameDisplay").innerHTML = account;

    // Handle the Date Range dynamic string formatting logic
    const rangeContainer = document.getElementById("dateRangeDisplay");
    if (fromDate || toDate) {
        const formattedFrom = formatToIndianDate(fromDate);
        const formattedTo = formatToIndianDate(toDate);
        rangeContainer.innerHTML = `Date Range: ${formattedFrom} - ${formattedTo}`;
        rangeContainer.style.display = "block";
    } else {
        rangeContainer.style.display = "none";
    }

    document.getElementById("generatedOn").innerHTML =
        new Date().toLocaleString();

    const body = document.getElementById("reportBody");

    body.innerHTML = `
        <tr>
            <td colspan="6" class="center">
                Loading...
            </td>
        </tr>
    `;

    try {

        const res = await fetch(
            `/transactionbrowser/transaction-search/?${params.toString()}`
        );

        if (!res.ok) {

            throw new Error(`HTTP ${res.status}`);

        }

        const data = await res.json();

        if (!data.transactions || data.transactions.length === 0) {

            body.innerHTML = `
                <tr>
                    <td colspan="6" class="center">
                        No matching records found!
                    </td>
                </tr>
            `;

            return;
        }

        const rows = [];

        let i = 0;
        let totCashIn = 0;
        let totCashOut = 0;
        let lastItem = null;

        data.transactions.forEach((item, index) => {

            lastItem = item;

            // Insert the extra opening row immediately if this was the first item
            if (index === 0) {
                rows.push(`
                    <tr>

                        <td class="center"></td>

                        <td class="nowrap"></td>

                        <td class="num">(Opening)</td>

                        <td class="num"></td>

                        <td class="num"></td>

                        <td class="num">
                            ${formatIndianCurrency(item.open_balance)}
                        </td>

                    </tr>
                `);
            }

            totCashIn += Number(item.cr_amt || 0);
            totCashOut += Number(item.dr_amt || 0);

            const notes =
                (item.acc_notes || "")
                .replaceAll(" • ", " • <wbr> ");

            rows.push(`

                <tr>

                    <td class="center">
                        ${++i}
                    </td>

                    <td class="nowrap">
                        ${formatToIndianDate(item.acctran_date)}
                    </td>

                    <td>
                        ${notes}
                    </td>

                    <td class="num">
                        ${
                            item.cr_amt == 0
                            ? "-"
                            : formatIndianCurrency(item.cr_amt)
                        }
                    </td>

                    <td class="num">
                        ${
                            item.dr_amt == 0
                            ? "-"
                            : formatIndianCurrency(item.dr_amt)
                        }
                    </td>

                    <td class="num">
                        ${formatIndianCurrency(item.balance)}
                    </td>

                </tr>

            `);

        });

        rows.push(`

            <tr class="summary-row">

                <td colspan="2"></td>

                <td class="num">
                    ${formatIndianCurrency(lastItem.open_balance)}
                </td>

                <td class="num">
                    (-)${formatIndianCurrency(totCashIn)}
                </td>

                <td class="num">
                    ${formatIndianCurrency(totCashOut)}
                </td>

                <td class="num">
                    ${formatIndianCurrency(lastItem.balance)}
                </td>

            </tr>

        `);

        body.innerHTML = rows.join("");

        // Populate the summary card records
        document.getElementById("topOpening").innerHTML = formatIndianCurrency(data.transactions[0].open_balance);
        document.getElementById("topCashIn").innerHTML  = formatIndianCurrency(totCashIn);
        document.getElementById("topClosingOut").innerHTML = formatIndianCurrency(totCashOut);
        document.getElementById("topClosing").innerHTML = formatIndianCurrency(lastItem.balance);

    }
    catch (err) {

        console.error(err);

        body.innerHTML = `
            <tr>
                <td colspan="6" class="center">
                    Error loading report
                </td>
            </tr>
        `;
    }
}

window.addEventListener("load", loadReport);

</script>

</body>
</html>
