<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Print Preview</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            margin: 25px;
            font-size: 13px;
        }
        .header {
            text-align: center;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }
        .header h2 { margin: 0; text-transform: uppercase; }
        
        .meta-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 12px;
            border-bottom: 2px solid #222; 
            padding-bottom: 8px;
        }
        
        .report-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        .pivot-table {
            width: 60% !important;
            margin-bottom: 40px;
            margin-left: auto; 
        }
        .report-table th, .report-table td {
            border: 1px solid #cccccc;
            padding: 6px 8px;
            text-align: left;
        }
        .report-table th {
            background-color: #eaeaea;
            font-size: 11px;
            text-transform: uppercase;
        }
        .num-col { text-align: right !important; }
        .center-col { text-align: center; }
        
        /* Section styling rules */
        .item-section-header {
            background-color: #f9f9f9;
            font-weight: bold;
            font-size: 12px;
            color: #004499;
        }
        .subtotal-row {
            font-weight: bold;
            background-color: #f5f5f5;
        }

        .control-panel {
            background: #f4f4f4;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .btn {
            background-color: #0066cc;
            color: #fff;
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
        }
        @media print {
            .control-panel { display: none !important; }
            body { margin: 0; font-size: 11px; }
            tr { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <span><strong>Print Preview Mode</strong> — Confirm records look correct before running layout print.</span>
        <button class="btn" onclick="window.print()">Print Document</button>
    </div>

    <div class="header">
        <h2 id="reportTitle">Report</h2>    
    </div>

    <div class="meta-bar">
        <div id="metaDates">Date Coverage: All Records</div>
        <div id="metaTimestamp"></div>
    </div>

    <!-- Pivot Matrix View Block (Grand Total Row Removed) -->
    <table class="report-table pivot-table">
        <thead>
            <tr>
                <th style="width: 28%;">Item Code</th>
                <th class="num-col" style="width: 15%;">Stock In</th>
                <th class="num-col" style="width: 21%;">Stock In Amount</th>
                <th class="num-col" style="width: 15%;">Stock Out</th>
                <th class="num-col" style="width: 21%;">Stock Out Amt</th>
            </tr>
        </thead>
        <tbody id="pivotContent">
            <tr>
                <td colspan="5" class="center-col">Generating matrix view summaries...</td>
            </tr>
        </tbody>
    </table>

    <!-- Main Itemized Transaction Split Table -->
    <table class="report-table">
        <tbody id="printContent">
            <tr>
                <td id="initialLoadingCell" colspan="8" class="center-col">Loading report records...</td>
            </tr>
        </tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("metaTimestamp").innerText = "Printed: " + new Date().toLocaleString();

            const records = JSON.parse(localStorage.getItem("print_report_payload"));
            const metadata = JSON.parse(localStorage.getItem("print_report_metadata")) || {};

            let isSameDate = false;
            if (metadata.from_date && metadata.to_date && metadata.from_date.trim() === metadata.to_date.trim()) {
                isSameDate = true;
            }

            if (metadata.report_name) {
                document.getElementById("reportTitle").innerText = metadata.report_name;
            }
            if (metadata.from_date || metadata.to_date) {
                document.getElementById("metaDates").innerText = `Date Range: ${metadata.from_date || 'Start'} To ${metadata.to_date || 'End'}`;
            }

            const tbody = document.getElementById("printContent");
            const pivotTbody = document.getElementById("pivotContent");
            
            tbody.innerHTML = "";
            pivotTbody.innerHTML = "";

            const totalCols = isSameDate ? 7 : 8;

            if (!records || records.length === 0) {
                const noDataRow = `<tr><td colspan="${totalCols}" class="center-col">No data rows found matching the filter query parameters.</td></tr>`;
                tbody.innerHTML = noDataRow;
                pivotTbody.innerHTML = `<tr><td colspan="5" class="center-col">No summary records compiled.</td></tr>`;
                return;
            }

            function formatVal(val) {
                const num = Number(val || 0);
                if (num === 0) return "-";
                return num.toFixed(2); 
            }

            // 1. Structural Grouping by Item Code
            const sections = {};
            records.forEach(row => {
                const itemCode = row.item_code || "UNKNOWN ITEM";
                if (!sections[itemCode]) {
                    sections[itemCode] = [];
                }
                sections[itemCode].push(row);
            });

            const pivotSummary = {};

            // 2. Process Sections and Accumulate Pivot Values
            Object.keys(sections).forEach(itemCode => {
                const headerTr = document.createElement("tr");
                headerTr.className = "item-section-header";
                headerTr.innerHTML = `<td colspan="${totalCols}">Item Code: ${itemCode}</td>`;
                tbody.appendChild(headerTr);

                let runningSerial = 1;
                let subtotalInQty = 0;
                let subtotalOutQty = 0;
                let subtotalAmtIn = 0;
                let subtotalAmtOut = 0;

                sections[itemCode].sort((a, b) => {
                    const qtyA = Number(a.stock_in || 0);
                    const qtyB = Number(b.stock_in || 0);
                    return qtyB - qtyA;
                });

                sections[itemCode].forEach(row => {
                    const dataInQty = Number(row.stock_in || 0);
                    const dataOutQty = Number(row.stock_out || 0);
                    const rawAmount = Math.abs(Number(row.item_tot_amt || 0));

                    let displayAmtIn = 0;
                    let displayAmtOut = 0;

                    if (dataInQty > 0) {
                        displayAmtIn = rawAmount;
                        displayAmtOut = 0;
                    } else if (dataOutQty > 0) {
                        displayAmtIn = 0;
                        displayAmtOut = rawAmount;
                    }

                    subtotalInQty += dataInQty;
                    subtotalOutQty += dataOutQty;
                    subtotalAmtIn += displayAmtIn;
                    subtotalAmtOut += displayAmtOut;

                    let rowHtml = `<td class="center-col" style="width: 5%;">${runningSerial++}</td>`;
                    
                    if (!isSameDate) {
                        rowHtml += `<td style="width: 11%;">${row.trans_date || ''}</td>`;
                        rowHtml += `<td style="width: 36%;">${row.acc_disp_name || ''}</td>`;
                    } else {
                        rowHtml += `<td style="width: 47%;">${row.acc_disp_name || ''}</td>`; 
                    }

                    rowHtml += `
                        <td style="width: 12%;">${row.acctran_ref_type || ''}</td>
                        <td class="num-col" style="width: 9%;">${formatVal(dataInQty)}</td>
                        <td class="num-col" style="width: 9%;">${formatVal(displayAmtIn)}</td>
                        <td class="num-col" style="width: 9%;">${formatVal(dataOutQty)}</td>
                        <td class="num-col" style="width: 9%;">${formatVal(displayAmtOut)}</td>
                    `;

                    const tr = document.createElement("tr");
                    tr.innerHTML = rowHtml;
                    tbody.appendChild(tr);
                });

                const subtotalTr = document.createElement("tr");
                subtotalTr.className = "subtotal-row";
                subtotalTr.innerHTML = `
                    <td colspan="${isSameDate ? 3 : 4}" style="text-align: right;">${itemCode} (Total)</td>
                    <td class="num-col">${formatVal(subtotalInQty)}</td>
                    <td class="num-col">${formatVal(subtotalAmtIn)}</td>
                    <td class="num-col">${formatVal(subtotalOutQty)}</td>
                    <td class="num-col">${formatVal(subtotalAmtOut)}</td>
                `;
                tbody.appendChild(subtotalTr);

                pivotSummary[itemCode] = {
                    stock_in: subtotalInQty,
                    stock_in_amt: subtotalAmtIn,
                    stock_out: subtotalOutQty,
                    stock_out_amt: subtotalAmtOut
                };
            });

            // 3. Render Pivot Rows dynamically using pivotSummary data map
            Object.keys(pivotSummary).forEach(itemCode => {
                const itemData = pivotSummary[itemCode];
                const pTr = document.createElement("tr");
                pTr.innerHTML = `
                    <td><strong>${itemCode}</strong></td>
                    <td class="num-col">${formatVal(itemData.stock_in)}</td>
                    <td class="num-col">${formatVal(itemData.stock_in_amt)}</td>
                    <td class="num-col">${formatVal(itemData.stock_out)}</td>
                    <td class="num-col">${formatVal(itemData.stock_out_amt)}</td>
                `;
                pivotTbody.appendChild(pTr);
            });
        });
    </script>
</body>
</html>
