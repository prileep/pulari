<table>
    <tr class="rowSpacing"><td></td></tr>
    <tr>
        <td style="width:20%;">
            {% if discount.disc_rid and discount.disc_status != 'Cancelled' %}
                <input type="hidden" id="rid" name="rid" value="{{ discount.disc_rid }}">

                <button type="submit" 
                        name="action" 
                        value="cancel"
                        formaction="/discount/"
                        class="searchLink"
                        style="background: none; border: none; padding: 0; cursor: pointer;"
                        onclick="return confirm('Are you sure to cancel this discount?');">
                Cancel this discount
                </button>
            {% endif %}
        </td>
        <td style="text-align: right; width:80%;">
            {% if discount.disc_rid %}
                <button type="button" class="submitButton"
                data-rid="{{ discount.disc_rid }}"
                onclick="openPrintDiscount(this.dataset.rid)">Print</button>&nbsp;
            {% else %}
                <button type="submit" class="submitButton">Submit</button>&nbsp;
            {% endif %}
            <button type="button" onclick="window.location.href='/discount'" class="submitButton">Clear</button>
        </td>
    </tr>
</table>
